<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; width:1080px; height:1080px; overflow:hidden; }

  /* Same warm cream-to-peach brand gradient as the original logo. */
  body {
    background: radial-gradient(circle at 30% 22%, #fffaf2 0%, #fde9d2 44%, #f6b878 100%);
    font-family: Tahoma, "Segoe UI", Arial, sans-serif;
    display:flex; align-items:center; justify-content:center;
  }

  /* 800px badge = radius 400px, inside the 75-80% circular safe area. */
  .badge {
    width:800px; height:800px; border-radius:50%;
    background: linear-gradient(145deg, rgba(255,255,255,.74), rgba(255,255,255,.20));
    border:1px solid rgba(255,255,255,.78);
    box-shadow: 0 34px 90px rgba(178,92,30,.22), inset 0 2px 2px rgba(255,255,255,.9);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }

  .mark {
    width:150px; height:150px; border-radius:48px;
    background:linear-gradient(145deg,#ff9a4d,#e8762a);
    box-shadow:0 18px 40px rgba(214,100,34,.35), inset 0 2px 4px rgba(255,255,255,.5);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:10px;
  }

  .arabic {
    font-size:186px; line-height:1; font-weight:700;
    color:#5b2f13; letter-spacing:-5px;
    margin-top:-8px;
    text-shadow:0 2px 0 rgba(255,255,255,.7);
  }

  .english {
    font-family:"Segoe UI",Arial,sans-serif;
    font-size:42px; font-weight:700; letter-spacing:20px;
    color:#a4531d; margin-top:16px; padding-left:20px;
  }

  .rule { width:130px; height:5px; border-radius:5px; background:#e8762a; opacity:.85; margin-top:22px; }
</style>
</head>
<body>
  <div class="badge">
    <div class="mark">
      <svg width="88" height="88" viewBox="0 0 30 30" fill="none" aria-hidden="true">
        <path d="M6 7.5h18v12H14l-5.5 4v-4H6z" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M10.5 12.5h9M10.5 16h5.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="arabic">حكي</div>
    <div class="english" dir="ltr">HAKI</div>
    <div class="rule"></div>
  </div>
</body>
</html>
